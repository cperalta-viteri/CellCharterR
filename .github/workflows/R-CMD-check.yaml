name: Linux CPU package check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    env:
      CELLCHARTERR_CPU_ONLY: "true"
      CUDA_VISIBLE_DEVICES: ""
      _R_CHECK_FORCE_SUGGESTS_: "false"
      R_KEEP_PKG_SOURCE: yes
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools and R dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends strace
          Rscript -e 'BiocManager::install(c("remotes", "rcmdcheck", "BiocCheck"), ask = FALSE, update = FALSE)'
          Rscript -e 'options(repos = BiocManager::repositories()); remotes::install_deps(dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = "never", repos = BiocManager::repositories())'
          Rscript -e 'BiocManager::install(c("BiocStyle", "ggplot2", "ggspavis", "jsonlite", "knitr", "MASS", "rmarkdown", "testthat"), ask = FALSE, update = FALSE)'

      - name: Build, check, and run the tiny CPU smoke test without network access
        shell: bash
        run: |
          printf '%s\n' 'options(repos = structure(character(), names = character()))' > /tmp/CellCharterR-offline.Rprofile
          export R_PROFILE_USER=/tmp/CellCharterR-offline.Rprofile
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          export HTTP_PROXY=http://127.0.0.1:9
          export HTTPS_PROXY=http://127.0.0.1:9
          # R 4.6 can contact public clock services while checking future file
          # timestamps. Keep the local timestamp check, but disable that remote
          # clock probe so the offline-execution assertion measures package code.
          export _R_CHECK_SYSTEM_CLOCK_=false
          strace -f -e trace=network -o network-build.trace R CMD build .
          strace -f -e trace=network -o network-check.trace R CMD check --no-manual CellCharterR_*.tar.gz
          mkdir /tmp/CellCharterR-ci-library
          strace -f -e trace=network -o network-install.trace R CMD INSTALL --library=/tmp/CellCharterR-ci-library CellCharterR_*.tar.gz
          R_LIBS_USER=/tmp/CellCharterR-ci-library strace -f -e trace=network -o network-smoke.trace Rscript inst/scripts/ci-cpu-smoke.R cpu-smoke.rds
          R_LIBS_USER=/tmp/CellCharterR-ci-library Rscript -e 'invisible(suppressWarnings(lapply(c("HDF5Array", "SummarizedExperiment"), requireNamespace, quietly = TRUE))); library(CellCharterR); testthat::test_file("tests/testthat/test-analysis-bundle.R", package = "CellCharterR", reporter = "summary", stop_on_failure = TRUE, stop_on_warning = TRUE)'
          # The R CMD check process may try the deliberately unreachable proxy
          # above. That traffic cannot leave the runner. Record every
          # IPv4/IPv6 connect call, then reject any destination other than the
          # exact loopback proxy configured by this job.
          grep -hE 'connect\([^,]+,.*(AF_INET6?|sin_port)' network-*.trace > network-connects.trace || true
          grep -Ev 'sa_family=AF_INET, sin_port=htons\(9\), sin_addr=inet_addr\("127\.0\.0\.1"\)' network-connects.trace > network-unexpected.trace || true
          if test -s network-unexpected.trace; then
            cat network-unexpected.trace >&2
            echo 'Unexpected outbound IPv4/IPv6 connection occurred after dependency installation.' >&2
            exit 1
          fi

      - name: Run Bioconductor policy checks
        shell: bash
        run: |
          Rscript -e 'BiocCheck::BiocCheck(Sys.glob("CellCharterR_*.tar.gz")[[1]], new.package = TRUE)'

      - name: Retain CPU and offline-network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CellCharterR-linux-cpu-validation
          path: |
            CellCharterR.Rcheck/00check.log
            CellCharterR.BiocCheck/00BiocCheck.log
            cpu-smoke.rds
            network-*.trace
